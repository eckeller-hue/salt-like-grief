<!DOCTYPE html>

    <style>
        body {
        margin: 0;
        padding: 0;
        background: #0c0c0c;
        color: #efe7d5;
        font-family: 'Inter', sans-serif;
        }

        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: .02em;
            font-weight: 600;
        }

        a,
        a:hover,
        a:visited {
            color: #0071bc;
        }

        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        #header {
            position: absolute;
            z-index: 10;

            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 50%;
            max-width: 700px;

            padding: 2.5rem 3rem;

            background: rgba(24,18,14,.88);
            color: #efe7d5;

            text-align: center;

            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }
        
        #header h1 {
            font-size: 5rem;
            margin-bottom: .5rem;
        }

        #header h2 {
            font-size: 1.5rem;
            font-weight: 300;
            max-width: 700px;
        }

        #header p {
            font-size: .95rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-top: 2rem;
        }

        #footer {
            width: 100%;
            min-height: 5vh;
            padding-top: 2vh;
            padding-bottom: 2vh;
            text-align: center;
            line-height: 25px;
            font-size: 13px;
            position: relative;
            z-index: 5;
        }

        #features {
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        .hidden {
            visibility: hidden;
        }

        .centered {
            width: 80vw;
            margin: 0 auto;
        }

        .lefty {
            width: 40vw;
            margin-left: 5vw;
        }

        .righty {
            width: 40vw;
            margin-left: 62vw;
        }

        .fully {
            width: 100%;
            margin: auto;
        }

        .fully img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }

        .fully div {
            background: transparent !important;
            padding: 0 !important;
        }

        .light {
            color: #444;
            background-color: #fafafa;
        }

        .dark {
             color: #efe7d5;
            background-color: rgba(24,18,14,.88);
        }

        .step {
            padding-bottom: 50vh;
            /* margin-bottom: 10vh; */
            opacity: 0.25;
        }

        .step h3 {
        font-size: 2.25rem;
        margin-bottom: 1rem;
    }

        .step.active {
            opacity: 0.98;
        }

       .step div {
            padding: 25px 50px;
            line-height: 25px;
            font-size: 13px;
        }
         .step img {
            width: 100%;
    
        }

        @media (max-width: 750px) {

            .centered,
            .lefty,
            .righty,
            .fully {
                width: 90vw;
                margin: 0 ;
            }
        }


        /* Fix issue on mobile browser where scroll breaks  */
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }

            'fill': ['fill-opacity'],
            'line': ['line-opacity'],
            'circle': ['circle-opacity', 'circle-stroke-opacity'],
            'symbol': ['icon-opacity', 'text-opacity'],
            'raster': ['raster-opacity'],
            'fill-extrusion': ['fill-extrusion-opacity'],
            'heatmap': ['heatmap-opacity']
        }

        var alignments = {
            'left': 'lefty',
            'center': 'centered',
            'right': 'righty',
            'full': 'fully'
        }

        function getLayerPaintType(layer) {
            var layerType = map.getLayer(layer).type;
            return layerTypes[layerType];
        }

        function setLayerOpacity(layer) {
            var paintProps = getLayerPaintType(layer.layer);
            paintProps.forEach(function (prop) {
                var options = {};
                if (layer.duration) {
                    var transitionProp = prop + "-transition";
                    options = { "duration": layer.duration };
                    map.setPaintProperty(layer.layer, transitionProp, options);
                }
                map.setPaintProperty(layer.layer, prop, layer.opacity, options);
            });
        }
        // Animation function for all trade routes
        var slaveTradeAnimationId;
        function animateSlaveTradeRoutes() {
            let time = 0;
            const animate = () => {
                time += 0.01;
                if (time > 1) time = 0;
                
                // Check if slave trade moving arrows layer exists and get its opacity
                if (map.getLayer('slave-trade-moving-arrows')) {
                    const currentOpacity = map.getPaintProperty('slave-trade-moving-arrows', 'text-opacity');
                    
                    // Stop animation if layer is hidden
                    if (currentOpacity === 0) {
                        cancelAnimationFrame(slaveTradeAnimationId);
                        return;
                    }
                }
                
                // Use text-offset to create animation effect along the line
                // Moving dots forward and backward along the path
                const offset = Math.sin(time * Math.PI * 2) * 20; // Oscillates between -20 and 20
                const opacity = 0.6 + 0.4 * Math.sin(time * Math.PI * 2);
                
                // Animate slave trade moving dots
                if (map.getLayer('slave-trade-moving-arrows')) {
                    map.setPaintProperty('slave-trade-moving-arrows', 'text-opacity', opacity);
                    map.setLayoutProperty('slave-trade-moving-arrows', 'text-offset', [offset / 10, 0]);
                }
                
                // Animate UK/Europe moving dots
                if (map.getLayer('uk-europe-moving-arrows')) {
                    map.setPaintProperty('uk-europe-moving-arrows', 'text-opacity', opacity);
                    map.setLayoutProperty('uk-europe-moving-arrows', 'text-offset', [offset / 10, 0]);
                }
                
                slaveTradeAnimationId = requestAnimationFrame(animate);
            };
            slaveTradeAnimationId = requestAnimationFrame(animate);
        }
        // Global function to start slave trade animation
        window.startSlaveTradeAnimation = function() {
            animateSlaveTradeRoutes();
        };

        // Animation function for blinking cities
        var cityBlinkInterval;
        var isCityBlinkingEnabled = false;
        function animateCitiesBlink() {
            let time = 0;
            cityBlinkInterval = setInterval(() => {
                if (!isCityBlinkingEnabled) {
                    clearInterval(cityBlinkInterval);
                    cityBlinkInterval = null;
                    return;
                }
                
                time += 0.02;
                if (time > 1) time = 0;
                
                if (map.getLayer('highlighted-cities-layer')) {
                    // Create pulsing blink effect
                    const opacity = Math.abs(Math.sin(time * Math.PI));
                    
                    map.setPaintProperty('highlighted-cities-layer', 'circle-opacity', opacity * 0.7);
                    map.setPaintProperty('highlighted-cities-layer', 'circle-stroke-opacity', opacity);
                }
            }, 30);
        }

        // Global function to start city blinking
        window.startCityBlink = function() {
            isCityBlinkingEnabled = true;
            animateCitiesBlink();
        };

        // Global function to stop city blinking
        window.stopCityBlink = function() {
            isCityBlinkingEnabled = false;
            if (cityBlinkInterval) {
                clearInterval(cityBlinkInterval);
                cityBlinkInterval = null;
            }
        };

        var features = document.createElement('div');
        features.setAttribute('id', 'features');

        var header = document.createElement('div');

        if (config.title) {
            var titleText = document.createElement('h1');
            titleText.innerText = config.title;
            header.appendChild(titleText);
        }

        if (config.subtitle) {
            var subtitleText = document.createElement('h2');
            subtitleText.innerText = config.subtitle;
            header.appendChild(subtitleText);
        }

        if (config.byline) {
            var bylineText = document.createElement('p');
            bylineText.innerText = config.byline;
            header.appendChild(bylineText);
        }

        if (header.innerText.length > 0) {
            header.classList.add(config.theme);
            header.setAttribute('id', 'header');
            story.appendChild(header);
        }

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');

            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                chapter.appendChild(title);
            }

            if (record.image) {
                var image = new Image();
                image.src = record.image;
                chapter.appendChild(image);
            }

            if (record.description) {
                var story = document.createElement('p');
                story.innerHTML = record.description;
                chapter.appendChild(story);
            }

            container.setAttribute('id', record.id);
            container.classList.add('step');
            if (idx === 0) {
                container.classList.add('active');
            }

            chapter.classList.add(config.theme);
            container.appendChild(chapter);
            container.classList.add(alignments[record.alignment] || 'centered');
            if (record.hidden) {
                container.classList.add('hidden');
            }
            features.appendChild(container);
        });

                'layout': {
                    'symbol-placement': 'line',
                    'text-field': '●',
                    'text-size': 24,
                    'text-allow-overlap': true,
                    'text-ignore-placement': true
                },
                'paint': {
                    'text-opacity': 0,
                    'text-color': '#357abd'
                }
            });

            // Add line layer for West Indies routes
            map.addLayer({
                'id': 'west-indies-lines',
                'type': 'line',
                'source': 'west-indies-routes',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': '#5cb85c',
                    'line-width': 3,
                    'line-opacity': 0
                }
            });

            // Add static arrows along the West Indies routes (pointing north)
            map.addLayer({
                'id': 'west-indies-arrows',
                'type': 'symbol',
                'source': 'west-indies-routes',
                'layout': {
                    'symbol-placement': 'line',
                    'symbol-spacing': 80,
                    'text-field': '●',
                    'text-size': 20,
                    'text-allow-overlap': false,
                    'text-ignore-placement': false,
                    'text-rotation-alignment': 'map',
                    'text-keep-upright': false
                },
                'paint': {
                    'text-opacity': 0,
                    'text-color': '#5cb85c'
                }
            });

            // Add animated moving arrows for West Indies routes
            map.addLayer({
                'id': 'west-indies-moving-arrows',
                'type': 'symbol',
                'source': 'west-indies-routes',
                'layout': {
                    'symbol-placement': 'line',
                    'text-field': '●',
                    'text-size': 20,
                    'text-allow-overlap': true,
                    'text-ignore-placement': true,
                    'text-rotation-alignment': 'map',
                    'text-keep-upright': false
                },
                'paint': {
                    'text-opacity': 0,
                    'text-color': '#4cae4c'
                }
            });

            // Add source for highlighted cities
            map.addSource('highlighted-cities', {
                'type': 'geojson',
                'data': {
                    'type': 'FeatureCollection',
                    'features': [
                        {
                            'type': 'Feature',
                            'properties': {'name': 'Kingston, Jamaica'},
                            'geometry': {'type': 'Point', 'coordinates': [-76.8, 18.0]}
                        },
                        {
                            'type': 'Feature',
                            'properties': {'name': 'Montego Bay, Jamaica'},
                            'geometry': {'type': 'Point', 'coordinates': [-77.92, 18.49]}
                        },
                        {
                            'type': 'Feature',
                            'properties': {'name': 'Bridgetown, Barbados'},
                            'geometry': {'type': 'Point', 'coordinates': [-59.54, 13.19]}
                        },
                        {
                            'type': 'Feature',
                            'properties': {'name': 'Port of Spain, Trinidad and Tobago'},
                            'geometry': {'type': 'Point', 'coordinates': [-61.50, 10.69]}
                        },
                        {
                            'type': 'Feature',
                            'properties': {'name': 'Sint Maarten'},
                            'geometry': {'type': 'Point', 'coordinates': [-63.05, 18.04]}
                        },
                        {
                            'type': 'Feature',
                            'properties': {'name': 'Grenada'},
                            'geometry': {'type': 'Point', 'coordinates': [-61.79, 12.05]}
                        },
                        {
                            'type': 'Feature',
                            'properties': {'name': 'Nassau, Bahamas'},
                            'geometry': {'type': 'Point', 'coordinates': [-77.35, 25.08]}
                        },
                        {
                            'type': 'Feature',
                            'properties': {'name': 'Santo Domingo, Dominican Republic'},
                            'geometry': {'type': 'Point', 'coordinates': [-69.93, 18.47]}
                        }
                    ]
                }
            });

            // Add layer for highlighted cities
            map.addLayer({
                'id': 'highlighted-cities-layer',
                'type': 'circle',
                'source': 'highlighted-cities',
                'paint': {
                    'circle-radius': 20,
                    'circle-color': '#9b59b6',
                    'circle-opacity': 0,
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#d7b5e8',
                    'circle-stroke-opacity': 0
                }
            });

            if (config.use3dTerrain) {
                map.addSource('mapbox-dem', {
                    'type': 'raster-dem',
                    'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
                    'tileSize': 512,
                    'maxzoom': 14
                });
                // add the DEM source as a terrain layer with exaggerated height
                map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

                // add a sky layer that will show when the map is highly pitched
                map.addLayer({
                    'id': 'sky',
                    'type': 'sky',
                    'paint': {
                        'sky-type': 'atmosphere',
                        'sky-atmosphere-sun': [0.0, 0.0],
                        'sky-atmosphere-sun-intensity': 15
                    }
                });
            };

            // setup the instance, pass callback functions
            scroller
                .setup({
                    step: '.step',
                    offset: 0.5,
                    progress: true
                })
                .onStepEnter(async response => {
                    var current_chapter = config.chapters.findIndex(chap => chap.id === response.element.id);
                    var chapter = config.chapters[current_chapter];

                    response.element.classList.add('active');
                    map[chapter.mapAnimation || 'flyTo'](chapter.location);

                    if (config.showMarkers) {
                        marker.setLngLat(chapter.location.center);
                    }
                    if (chapter.onChapterEnter.length > 0) {
                        chapter.onChapterEnter.forEach(setLayerOpacity);
                    }
                    if (chapter.callback) {
                        window[chapter.callback]();
                    }
                    if (chapter.rotateAnimation) {
                        map.once('moveend', () => {
                            const rotateNumber = map.getBearing();
                            map.rotateTo(rotateNumber + 180, {
                                duration: 30000, easing: function (t) {
                                    return t;
                                }
                            });
                        });
                    }
                    if (config.auto) {
                        var next_chapter = (current_chapter + 1) % config.chapters.length;
                        map.once('moveend', () => {
                            document.querySelectorAll('[data-scrollama-index="' + next_chapter.toString() + '"]')[0].scrollIntoView();
                        });
                    }
                })
                .onStepExit(response => {
                    var chapter = config.chapters.find(chap => chap.id === response.element.id);
                    response.element.classList.remove('active');
                    if (chapter.onChapterExit.length > 0) {
                        chapter.onChapterExit.forEach(setLayerOpacity);
                    }
                    // Stop city blinking when exiting chronic-disease chapter
                    if (chapter.id === 'chronic-disease') {
                        window.stopCityBlink();
                    }
                });


            if (config.auto) {
                document.querySelectorAll('[data-scrollama-index="0"]')[0].scrollIntoView();
            }
        });    

    </script>

</body>

</html>
